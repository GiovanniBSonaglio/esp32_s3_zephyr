# OpenOCD config for ESP32-S3-DevKitC over the built-in USB Serial/JTAG port.
# The bundled esp_usb_bridge.cfg targets PID 0x1002 (external ESP-USB-Bridge probe).
# The DevKitC's built-in USB-Serial/JTAG enumerates as 0x303a:0x1001, so drive the
# esp_usb_jtag adapter directly with that VID:PID instead.
set ESP_RTOS Zephyr
set ESP_ONLYCPU 1

adapter driver esp_usb_jtag
espusbjtag vid_pid 0x303a 0x1001
# Required: without it the driver default fails with "could not retrieve
# jtag_caps descriptor!" on this SoC/OpenOCD build (0x2000 = built-in JTAG caps).
espusbjtag caps_descriptor 0x2000
adapter speed 5000

source [find target/esp32s3.cfg]
